# Configuración de pytest (pruebas automáticas de dIAra). Se corre desde la carpeta diara/:  python -m pytest
[pytest]
# Carpeta con las pruebas
testpaths = tests
# Igual que uvicorn --app-dir backend: permite "import config" y "from src import ..." dentro de las pruebas
pythonpath = backend
# -ra: al final lista las pruebas omitidas o fallidas con su motivo
addopts = -ra
